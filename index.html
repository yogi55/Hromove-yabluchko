<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EFE6">
<title>Громове яблучко</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=PT+Serif:wght@400;700&family=PT+Serif+Caption&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app" data-mode="read">
  <header class="bar">
    <span class="part" id="part"></span>
    <div class="bar-r">
      <div class="modes" id="modes" role="tablist">
        <button type="button" role="tab" id="tabListen" data-mode="listen"></button>
        <button type="button" role="tab" id="tabRead" data-mode="read"></button>
      </div>
      <button type="button" id="tocBtn" class="toc" aria-haspopup="dialog"></button>
    </div>
    <div class="lang" id="lang" hidden></div>
  </header>

  <h1 id="title" class="fade"></h1>

  <figure class="art fade" id="art">
    <img id="img" alt="" decoding="async">
    <div class="ph" id="ph" hidden></div>
  </figure>

  <div class="read" id="read">
    <div class="body fade" id="body">
      <article class="text" id="text" tabindex="0"></article>
      <nav class="cont" id="cont" aria-label="Навігація між частинами">
        <button type="button" id="next" class="next"></button>
        <button type="button" id="back" class="back"></button>
      </nav>
    </div>
    <i class="rail" id="rail" aria-hidden="true"><i id="thumb"></i></i>
  </div>

  <section class="player" id="player">
    <div class="ctrl">
      <button type="button" id="play" class="play"></button>
      <canvas id="wave" class="wave" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
    </div>
    <div class="state"><span id="state"></span><span id="time"></span></div>
  </section>

  <p class="fail" id="fail" hidden></p>
  <audio id="audio" preload="metadata"></audio>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" id="sheetClose" class="sheet-close" aria-label="Закрити">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ol class="sheet-list" id="sheetList"></ol>
  </div>
</div>

<noscript><p class="fail">Для перегляду потрібен JavaScript.</p></noscript>
<script src="js/app.js"></script>
</body>
</html>
